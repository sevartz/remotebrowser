<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteBrowser — Вход</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #fafafa;
        }
        h1, h2, .brand, .mono {
            font-family: 'Space Mono', monospace;
        }
    </style>
</head>
<body class="text-gray-900 min-h-screen flex flex-col">

    <header class="border-b border-gray-200 bg-white">
        <div class="max-w-5xl mx-auto px-6 py-4">
            <a href="/" class="brand text-xl font-bold">RemoteBrowser</a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-6">
        <div class="w-full max-w-sm">

            <div class="flex gap-2 mb-8 bg-gray-100 rounded-md p-1">
                <button id="tabLogin" class="flex-1 py-2 text-sm rounded mono">
                    Вход
                </button>
                <button id="tabRegister" class="flex-1 py-2 text-sm rounded mono">
                    Регистрация
                </button>
            </div>

            <h1 id="formTitle" class="text-2xl font-bold mb-6">Вход</h1>

            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-600">Email</label>
                    <input type="email" id="email" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md 
                                  focus:outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-600">Пароль</label>
                    <input type="password" id="password" required minlength="8"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md
                                  focus:outline-none focus:border-black">
                </div>

                <div id="errorBox" class="hidden text-sm text-red-600 bg-red-50 
                                         border border-red-200 rounded-md px-3 py-2">
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-black text-white py-2 rounded-md hover:bg-gray-800
                               disabled:opacity-50 disabled:cursor-not-allowed">
                    Войти
                </button>
            </form>

        </div>
    </main>

    <script>
        // State
        let mode = 'login';

        // Elements
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('authForm');
        const errorBox = document.getElementById('errorBox');

        // If user already has a token, redirect straight to play
        if (localStorage.getItem('token')) {
            window.location.href = '/play.html';
        }

        // Read mode from URL (?mode=register)
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === 'register') {
            setMode('register');
        } else {
            setMode('login');
        }

        function setMode(newMode) {
            mode = newMode;
            errorBox.classList.add('hidden');

            if (mode === 'login') {
                tabLogin.className = 'flex-1 py-2 text-sm rounded mono bg-white shadow-sm';
                tabRegister.className = 'flex-1 py-2 text-sm rounded mono text-gray-500';
                formTitle.textContent = 'Вход';
                submitBtn.textContent = 'Войти';
            } else {
                tabRegister.className = 'flex-1 py-2 text-sm rounded mono bg-white shadow-sm';
                tabLogin.className = 'flex-1 py-2 text-sm rounded mono text-gray-500';
                formTitle.textContent = 'Регистрация';
                submitBtn.textContent = 'Создать аккаунт';
            }
        }

        tabLogin.addEventListener('click', () => setMode('login'));
        tabRegister.addEventListener('click', () => setMode('register'));

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const endpoint = mode === 'login' ? '/auth/login' : '/auth/register';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('email', data.email);
                    window.location.href = '/play.html';
                } else if (res.status === 401) {
                    showError('Неверный email или пароль');
                } else if (res.status === 409) {
                    showError('Этот email уже зарегистрирован');
                } else if (res.status === 400) {
                    showError('Проверьте формат email и длину пароля (минимум 8 символов)');
                } else {
                    showError('Ошибка сервера. Попробуйте позже.');
                }
            } catch (err) {
                showError('Не удалось подключиться к серверу');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
